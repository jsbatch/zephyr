# test_read_consistency holds three page-sized buffers on the stack at once.
# The F-RAM this fixture uses reports a 256 byte page, so those alone take 768
# bytes of the 1024 byte default and leave nothing for the transfer call chain.
CONFIG_ZTEST_STACK_SIZE=2048
