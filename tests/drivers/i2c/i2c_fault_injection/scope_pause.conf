# Pause the run at selected conditions so an instrument can be armed for a
# single-shot capture. Build with:
#
#   west build -b <board> tests/drivers/i2c/i2c_fault_injection \
#           -- -DEXTRA_CONF_FILE=scope_pause.conf
#
# CONSOLE_GETCHAR belongs to an optional Kconfig choice and so cannot be
# selected by I2C_FAULT_TEST_SCOPE_PAUSE. The two are set together here
# instead. The suite becomes interactive, so do not use this fragment for an
# automated run.

CONFIG_I2C_FAULT_TEST_SCOPE_PAUSE=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y
